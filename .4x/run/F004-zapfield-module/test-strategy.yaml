web: false
api: false
coder_only: true
profiles:
  - unit
verify_commands:
  - "test -z \"$(grep -i zap v3/go.mod)\" && echo 'AC-2 core clean of zap' || (echo 'FAIL: zap leaked into core go.mod' && exit 1)"
  - "cd v3/zapfield && go build ./..."
  - "cd v3/zapfield && go vet ./..."
  - "! grep -REn 'zap.Any|zap.Reflect' v3/zapfield/*.go"
  - "cd v3/zapfield && go test -race ./..."
  - "cd v3 && go test ./..."
