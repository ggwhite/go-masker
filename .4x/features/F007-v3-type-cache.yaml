id: F007-v3-type-cache
name: "F007 v3 Struct() type cache + Format()"
status: not-started
priority: 1
depends:
    - F001-v3-core-interface
    - F006-v2-parity
description: |
    F003 的 type cache 和 Format() 被做到 v2 了，v3 的 Struct() 仍每次呼叫都重新 reflect 解析 tag。
    本 feature 把 v2 的 type_cache + Format() 移植到 v3。

    ## 背景

    v2 已有：
    - type_cache.go — sync.Map 快取 per-type field metadata（fieldMask struct）
    - format.go — Format() 直接輸出遮罩後字串，不配置新 struct
    - masker.go — Struct() 改用 cachedTypeInfo() 查 cache

    v3 的 Struct()（v3/masker.go）仍用原始 reflect 逐欄位解析，code review 已確認為效能瓶頸。

    ## 目標

    1. 在 v3/ 建立 type_cache.go，移植 v2 的 cachedTypeInfo/buildTypeInfo/fieldMask
    2. v3 Struct() 改用 cache（同 v2 重構方式）
    3. 在 v3/ 建立 format.go，移植 v2 Format()（適配 v3 的 Masker interface）
    4. benchmark 驗證效能改善

    ## 參考

    - v2 type_cache.go（直接參考，邏輯相同但 interface 不同）
    - v2 format.go（需適配 Mask() 取代 Marshal()）
    - v2 masker_bench_test.go（benchmark 範本）

    ## 與 v2 的差異

    - v3 的 Masker interface 是 Mask(value) 不是 Marshal(maskChar, value)
    - v3 的 mask char 在 MaskerMarshaler 上，不在每次呼叫
    - v3 Format() 的 error fallback 要輸出 mask chars（不洩漏原值，同 code review fix）
subtasks:
    - id: type-cache
      name: v3 type_cache.go
      status: not-started
      description: 移植 v2 type_cache.go 到 v3/，適配 v3 field 結構
    - id: struct-refactor
      name: v3 Struct() 改用 cache
      status: not-started
      depends: [type-cache]
      description: v3/masker.go Struct() 從逐欄位 reflect 改為查 cachedTypeInfo
    - id: format
      name: v3 format.go
      status: not-started
      depends: [type-cache]
      description: 移植 v2 format.go 到 v3/，適配 Mask() interface
    - id: benchmark
      name: 效能 benchmark
      status: not-started
      depends: [struct-refactor, format]
      description: BenchmarkStruct warm ≤ cold × 50%，BenchmarkFormat allocs ≤ BenchmarkStruct
rules:
    - Struct() 外部行為必須與目前 v3 一致（回傳值、error 條件）
    - Format() error fallback 輸出 mask chars 不洩漏原值
    - cache 是 concurrency-safe（sync.Map）
    - v3 所有既有測試必須通過
acceptance:
    - cachedTypeInfo 正確快取 v3 的 field metadata
    - Struct() 遮罩結果與改之前 byte-identical
    - BenchmarkStruct warm ns/op ≤ cold × 50%
    - Format() 輸出與 Struct() + fmt.Sprintf 一致
    - go test -race ./... 通過
