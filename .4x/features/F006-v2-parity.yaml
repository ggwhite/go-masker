id: F006-v2-parity
name: F006 v2 功能完整承繼驗證
description: |
    確保 v3 完整承繼 v2 截至 PR #38 的所有功能。
    F001 負責建新 interface 和遷移 masker，本 feature 負責補齊 F001 未覆蓋的部分並驗收。

    完整清單見 docs/design/v2-parity.md。

    ## 重點檢查項

    1. Struct() 全部處理能力遷移：
       - string / nested struct (value+ptr) / []string / []struct / []*struct / []interface{}
       - mapstruct tag（PR #38）：map→struct / map→*struct / map→[]struct / map→*[]struct / 巢狀 map
       - interface{} fields（搭配 struct tag）
       - nil 保留（nil pointer / nil slice / nil map）
       - 非 struct 輸入回傳 error（PR #35）
       - unexported fields 跳過
    2. AbuseMasker + AbuseWordLoader 完整保留（trie / LoadFromFile / LoadFromReader）
    3. SetMasker() 自訂 mask char
    4. DefaultMaskerMarshaler 全域實例
    5. Register / Unregister / Get / List API
    6. Concurrency-safe（sync.RWMutex）

    ## 驗收方式

    把 v2 所有測試案例移植到 v3，逐項對照 docs/design/v2-parity.md 勾選。
status: done
priority: 0
subtasks:
    - id: struct-migration
      name: Struct() 完整能力遷移
      status: not-started
      description: |
        string/nested struct/ptr/slice/map(mapstruct)/interface/nil/error/unexported 全部搬到 v3 新 interface
    - id: abuse-migration
      name: AbuseMasker + AbuseWordLoader 遷移
      status: not-started
      description: trie 結構 + LoadFromFile + LoadFromReader + struct tag 整合
    - id: api-surface
      name: API 表面驗證
      status: not-started
      description: |
        Register/Unregister/Get/List/SetMasker/DefaultMaskerMarshaler 全部在 v3 可用且行為一致
    - id: test-parity
      name: v2 測試案例移植
      status: not-started
      description: |
        v2 所有 _test.go 的測試案例在 v3 都有對應覆蓋， 逐項對照 docs/design/v2-parity.md 確認無遺漏
      depends:
        - struct-migration
        - abuse-migration
        - api-surface
rules:
    - 遮罩結果必須與 v2 完全一致（同 input 同 output）
    - 不可為了遷移方便而刪減 v2 功能
    - docs/design/v2-parity.md 是唯一真相源，有異動要同步更新
depends:
    - F001-v3-core-interface
